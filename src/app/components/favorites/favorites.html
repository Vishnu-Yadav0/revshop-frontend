<div class="favorites-page py-5">
    <div class="container">
        <h2 class="fw-bold mb-4">My Favorites</h2>

        <div *ngIf="loading()" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div *ngIf="!loading() && favorites().length === 0" class="text-center py-5 bg-white rounded-4 shadow-sm">
            <div class="mb-4">
                <i class="fa-solid fa-heart-crack fs-1 text-muted"></i>
            </div>
            <h4 class="text-muted">No favorites yet</h4>
            <p class="text-muted mb-4">You haven't added any products to your favorites list.</p>
            <a routerLink="/products" class="btn btn-primary btn-lg rounded-pill px-5">Explore Products</a>
        </div>

        <div class="row g-4" *ngIf="!loading() && favorites().length > 0">
            <div class="col-md-6 col-lg-4" *ngFor="let item of favorites()">
                <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden favorite-card">
                    <div class="p-0 text-center bg-light position-relative" style="height: 200px;">
                        <img [src]="item.productDetails?.imageUrl || 'assets/placeholder.png'" 
                             class="w-100 h-100 object-fit-cover" 
                             alt="{{ item.productDetails?.name }}">
                        <button class="btn btn-danger btn-sm rounded-circle position-absolute top-0 end-0 m-3"
                            (click)="removeFavorite(item.productId)">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-1">{{ item.productDetails?.name }}</h5>
                        <div class="d-flex gap-2 mt-3">
                            <a [routerLink]="['/product', item.productId]"
                                class="btn btn-outline-primary rounded-pill flex-grow-1">
                                View Details
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
